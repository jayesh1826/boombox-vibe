<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="40%" stop-color="#1e0b36"/>
      <stop offset="70%" stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7900ff"/>
    </linearGradient>
    <mask id="sunMask">
      <rect x="0" y="0" width="1920" height="1080" fill="white"/>
      <rect x="760" y="440" width="400" height="8" fill="black"/>
      <rect x="760" y="460" width="400" height="12" fill="black"/>
      <rect x="760" y="485" width="400" height="16" fill="black"/>
      <rect x="760" y="515" width="400" height="20" fill="black"/>
      <rect x="760" y="550" width="400" height="26" fill="black"/>
    </mask>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <circle cx="960" cy="450" r="180" fill="url(#sunGrad)" mask="url(#sunMask)" filter="url(#glow)"/>
  <path d="M 0 600 L 250 420 L 450 550 L 700 380 L 960 580 L 1220 380 L 1470 550 L 1670 420 L 1920 600 Z" fill="#0d0622" stroke="#7900ff" stroke-width="2" filter="url(#glow)"/>

  <g opacity="0.8">
    <rect x="-500" y="580" width="2920" height="500" fill="#080214"/>
    <line x1="0" y1="580" x2="1920" y2="580" stroke="#ff007f" stroke-width="3" filter="url(#glow)"/>
    <g stroke="#00f3ff" stroke-width="1.5" opacity="0.6">
      <line x1="960" y1="580" x2="-400" y2="1080"/>
      <line x1="960" y1="580" x2="200" y2="1080"/>
      <line x1="960" y1="580" x2="750" y2="1080"/>
      <line x1="960" y1="580" x2="960" y2="1080"/>
      <line x1="960" y1="580" x2="1170" y2="1080"/>
      <line x1="960" y1="580" x2="1720" y2="1080"/>
      <line x1="960" y1="580" x2="2320" y2="1080"/>
    </g>
    <g stroke="#ff007f" stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="590" x2="1920" y2="590"/>
      <line x1="0" y1="625" x2="1920" y2="625"/>
      <line x1="0" y1="695" x2="1920" y2="695"/>
      <line x1="0" y1="820" x2="1920" y2="820"/>
      <line x1="0" y1="1020" x2="1920" y2="1020"/>
    </g>
  </g>
</svg>
